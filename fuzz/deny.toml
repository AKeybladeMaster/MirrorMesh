[advisories]
ignore = []
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
include-dev = true
confidence-threshold = 0.8
unused-allowed-license = "warn"
exceptions = [
    # NCSA is needed only by the locked, fuzz-only libfuzzer-sys dependency.
    { crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
