name: Flutter app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mirrormesh_flutter
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  platform-build:
    name: Build ${{ matrix.target }} shell
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            command: flutter build windows --release --no-pub
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release --no-pub
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug --no-pub --target-platform android-arm64
          - target: ios
            os: macos-latest
            command: flutter build ios --no-codesign --no-pub
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/mirrormesh_flutter
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - if: matrix.target == 'android'
        run: sdkmanager --install "platforms;android-36" "ndk;28.2.13676358"
      - if: matrix.target == 'windows'
        run: rustup toolchain install 1.99.1 --profile minimal
      - if: matrix.target == 'linux'
        run: rustup toolchain install 1.99.1 --profile minimal
      - if: matrix.target == 'linux'
        run: rustup target add x86_64-unknown-linux-gnu --toolchain 1.99.1
      - if: matrix.target == 'android'
        run: rustup toolchain install 1.99.1 --profile minimal
      - if: matrix.target == 'android'
        run: rustup target add aarch64-linux-android --toolchain 1.99.1
      - if: matrix.target == 'ios'
        run: rustup toolchain install 1.99.1 --profile minimal
      - if: matrix.target == 'ios'
        run: rustup target add aarch64-apple-ios --toolchain 1.99.1
      - run: flutter pub get
      - if: matrix.target == 'windows'
        run: cargo build --manifest-path ../../Cargo.toml --package mm-ffi --target x86_64-pc-windows-msvc --release
      - if: matrix.target == 'linux'
        run: cargo build --manifest-path ../../Cargo.toml --package mm-ffi --target x86_64-unknown-linux-gnu --release
      - if: matrix.target == 'android'
        run: |
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android21-clang"
          cargo build --manifest-path ../../Cargo.toml --package mm-ffi --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp ../../target/aarch64-linux-android/release/libmm_ffi.so android/app/src/main/jniLibs/arm64-v8a/libmm_ffi.so
      - if: matrix.target == 'windows'
        run: flutter test --no-pub test/rust_bridge_test.dart
        env:
          MIRRORMESH_FFI_LIBRARY: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/mm_ffi.dll
      - run: ${{ matrix.command }}
      - if: matrix.target == 'linux'
        run: flutter test --no-pub test/rust_bridge_test.dart
        env:
          MIRRORMESH_FFI_LIBRARY: ${{ github.workspace }}/apps/mirrormesh_flutter/build/linux/x64/release/bundle/lib/libmm_ffi.so
      - if: matrix.target == 'android'
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile

          apk = "build/app/outputs/flutter-apk/app-debug.apk"
          library = "lib/arm64-v8a/libmm_ffi.so"
          with ZipFile(apk) as package:
              assert library in package.namelist(), f"{library} missing from {apk}"
          print(f"Verified {library} in {apk}")
          PY
