name: Flutter third-party license notices

on:
  pull_request:
    paths:
      - apps/mirrormesh_flutter/pubspec.yaml
      - apps/mirrormesh_flutter/pubspec.lock
      - scripts/create_flutter_notices.py
      - docs/THIRD-PARTY-NOTICES-flutter.txt
      - .github/workflows/flutter-third-party-notices.yml
  push:
    branches: [main]
    paths:
      - apps/mirrormesh_flutter/pubspec.yaml
      - apps/mirrormesh_flutter/pubspec.lock
      - scripts/create_flutter_notices.py
      - docs/THIRD-PARTY-NOTICES-flutter.txt
      - .github/workflows/flutter-third-party-notices.yml
  schedule:
    - cron: '18 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-third-party-notices-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve locked Flutter packages
        working-directory: apps/mirrormesh_flutter
        run: flutter pub get --enforce-lockfile

      - name: Generate Flutter runtime package notice preview
        working-directory: apps/mirrormesh_flutter
        run: >-
          python3 ../../scripts/create_flutter_notices.py
          --package-config .dart_tool/package_config.json
          --package-graph .dart_tool/package_graph.json
          --output "$RUNNER_TEMP/THIRD-PARTY-NOTICES-FLUTTER.txt"

      - name: Check generated notice snapshot
        run: diff -u docs/THIRD-PARTY-NOTICES-flutter.txt "$RUNNER_TEMP/THIRD-PARTY-NOTICES-FLUTTER.txt"

      - name: Retain Flutter-only notice preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-third-party-notices-${{ github.sha }}
          path: ${{ runner.temp }}/THIRD-PARTY-NOTICES-FLUTTER.txt
          if-no-files-found: ignore
          retention-days: 7
