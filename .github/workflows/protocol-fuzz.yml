name: Protocol parser fuzzing

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - crates/mm-protocol/**
      - tests/protocol-golden/**
      - fuzz/**
      - .github/workflows/protocol-fuzz.yml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_FUZZ_VERSION: '0.13.2'
  FUZZ_TIME: '300'

jobs:
  parse-message:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned stable toolchain for cargo-fuzz
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Install pinned nightly fuzz toolchain
        run: rustup toolchain install nightly-2026-10-17 --profile minimal

      - name: Install pinned cargo-fuzz
        run: |
          cargo +1.99.1 install --locked --version "$CARGO_FUZZ_VERSION" cargo-fuzz --root "$RUNNER_TEMP/cargo-fuzz"
          echo "$RUNNER_TEMP/cargo-fuzz/bin" >> "$GITHUB_PATH"

      - name: Build parser fuzz target
        run: cargo +nightly-2026-10-17 fuzz build parse_message

      - name: Fuzz bounded protocol inputs
        run: |
          mkdir -p "$RUNNER_TEMP/mm-protocol-corpus"
          cp fuzz/corpus/parse_message/* "$RUNNER_TEMP/mm-protocol-corpus/"
          cargo +nightly-2026-10-17 fuzz run parse_message "$RUNNER_TEMP/mm-protocol-corpus" -- \
            -max_total_time="$FUZZ_TIME" \
            -max_len=262145 \
            -timeout=2 \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7
