name: Rust third-party license notices

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - about.toml
      - docs/THIRD-PARTY-NOTICES-rust.txt
      - docs/THIRD-PARTY-NOTICES-rust.hbs
      - .github/workflows/rust-third-party-notices.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - about.toml
      - docs/THIRD-PARTY-NOTICES-rust.txt
      - docs/THIRD-PARTY-NOTICES-rust.hbs
      - .github/workflows/rust-third-party-notices.yml
  schedule:
    - cron: '53 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-third-party-notices-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Install pinned cargo-about
        run: cargo +1.99.1 install --locked --version 0.9.2 cargo-about --features cli

      - name: Generate Rust dependency notice preview
        run: cargo +1.99.1 about generate -o "$RUNNER_TEMP/THIRD-PARTY-NOTICES-RUST.txt" docs/THIRD-PARTY-NOTICES-rust.hbs

      - name: Check generated notice snapshot
        run: diff -u docs/THIRD-PARTY-NOTICES-rust.txt "$RUNNER_TEMP/THIRD-PARTY-NOTICES-RUST.txt"

      - name: Retain Rust-only notice preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-third-party-notices-${{ github.sha }}
          path: ${{ runner.temp }}/THIRD-PARTY-NOTICES-RUST.txt
          if-no-files-found: ignore
          retention-days: 7
