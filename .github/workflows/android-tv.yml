name: Android TV checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android TV resources and permission boundary
        shell: pwsh
        run: ./apps/android-tv/scripts/verify-shell.ps1
      - name: Test local approval state transitions
        shell: pwsh
        run: ./apps/android-tv/scripts/test-demo-state.ps1

  apk-build:
    name: Build Android TV debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-tv
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android TV build SDK
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Install Rust Android target
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.99.1
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Assemble native Android TV APK
        run: gradle :app:assembleDebug

      - name: Prepare build evidence directory
        run: mkdir -p build-evidence

      - name: Generate APK CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: apps/android-tv/app/build/outputs/apk/debug/app-debug.apk
          format: cyclonedx-json
          output-file: apps/android-tv/build-evidence/android-tv-debug.sbom.cdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Capture exact build versions and artifact digests
        working-directory: .
        run: >-
          python3 scripts/create_android_tv_build_manifest.py
          --apk apps/android-tv/app/build/outputs/apk/debug/app-debug.apk
          --sbom apps/android-tv/build-evidence/android-tv-debug.sbom.cdx.json
          --gradle-config apps/android-tv/build.gradle.kts
          --output apps/android-tv/build-evidence/android-tv-debug-build-manifest.json

      - name: Verify SBOM and print evidence digests
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          sbom="build-evidence/android-tv-debug.sbom.cdx.json"
          manifest="build-evidence/android-tv-debug-build-manifest.json"
          test -s "$apk"
          test -s "$sbom"
          test -s "$manifest"
          python3 - <<'PY'
          import json
          with open("build-evidence/android-tv-debug.sbom.cdx.json", encoding="utf-8") as source:
              assert json.load(source).get("bomFormat") == "CycloneDX"
          with open("build-evidence/android-tv-debug-build-manifest.json", encoding="utf-8") as source:
              evidence = json.load(source)
              assert evidence["release_status"] == "debug_build_only_not_release_eligible"
              assert evidence["artifacts"]["apk"]["sha256"]
              assert evidence["artifacts"]["sbom"]["sha256"]
          PY
          sha256sum "$apk" "$sbom" "$manifest" > build-evidence/SHA256SUMS
          sha256sum --check build-evidence/SHA256SUMS

      - name: Retain Android TV debug build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-tv-debug-evidence-${{ github.sha }}
          path: |
            apps/android-tv/app/build/outputs/apk/debug/app-debug.apk
            apps/android-tv/build-evidence/android-tv-debug.sbom.cdx.json
            apps/android-tv/build-evidence/android-tv-debug-build-manifest.json
            apps/android-tv/build-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
