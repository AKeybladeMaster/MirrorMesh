name: Rust core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and checks
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.99.1 clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo +1.99.1 test --workspace
