name: Rust dependency safety

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - fuzz/Cargo.lock
      - fuzz/deny.toml
      - deny.toml
      - rust-toolchain.toml
      - '**/Cargo.toml'
      - .github/workflows/dependency-safety.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - fuzz/Cargo.lock
      - fuzz/deny.toml
      - deny.toml
      - rust-toolchain.toml
      - '**/Cargo.toml'
      - .github/workflows/dependency-safety.yml
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned cargo-audit
        run: cargo +1.99.1 install --locked --version 0.22.2 cargo-audit
      - name: Audit locked Rust dependencies
        run: cargo +1.99.1 audit
      - name: Audit locked fuzz dependencies
        run: cargo +1.99.1 audit --file fuzz/Cargo.lock
      - name: Install pinned cargo-deny
        run: cargo +1.99.1 install --locked --version 0.20.2 cargo-deny
      - name: Check advisories, licenses, and sources
        run: cargo +1.99.1 deny --locked check advisories licenses sources
      - name: Check fuzz advisories, licenses, and sources
        run: cargo +1.99.1 deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check advisories licenses sources
