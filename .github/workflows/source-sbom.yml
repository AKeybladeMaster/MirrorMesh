name: Source dependency SBOM

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Generate CycloneDX source inventory
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: mirrormesh-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check SBOM and print digest
        run: |
          test -s mirrormesh-source.cdx.json
          sha256sum mirrormesh-source.cdx.json
      - name: Retain source SBOM for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirrormesh-source-sbom
          path: mirrormesh-source.cdx.json
          if-no-files-found: error
          retention-days: 7
