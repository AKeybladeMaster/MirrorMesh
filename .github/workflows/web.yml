name: TV web shell

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capability-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv-web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install locked TypeScript compiler
        run: npm ci
      - name: Compile TypeScript and run capability tests
        run: npm test
      - name: Check emitted JavaScript syntax
        run: node --check dist/app.js && node --check dist/capabilities.js
